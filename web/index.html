<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        
        canvas {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            width: 100vw;
            height: 100vh;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            backdrop-filter: blur(10px);
        }
        
        #info h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #3498db;
        }
        
        #info ul {
            margin: 0;
            padding-left: 20px;
        }
        
        #info li {
            margin: 5px 0;
        }
        
        .key {
            background: #34495e;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            color: #3498db;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            Loading Protein Viewer...
        </div>
        <canvas id="glcanvas" tabindex="1"></canvas>
    </div>

    <script>
        // Configuration
        const loadingDiv = document.getElementById("loading");
        const infoDiv = document.getElementById("info");
        
        // Show info panel when WASM is loaded
        window.addEventListener('load', () => {
            setTimeout(() => {
                loadingDiv.style.display = 'none';
                infoDiv.style.display = 'block';
            }, 1000);
        });
    </script>

    <!-- Load the WASM module -->
    <script src="mq_js_bundle.js"></script>
    <script>load("protein_viewer.wasm");</script>
</body>
</html>
