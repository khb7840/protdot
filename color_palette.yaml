# Color Palette Configuration for Protein Viewer
# Colors are specified as hexcodes: #RRGGBB or #RRGGBBAA
#
# This file defines color themes that can be switched with the 'M' key.
# Each theme provides colors for all coloring modes:
# - By Element (C key): Atomic element colors
# - By AA Group (C key): Amino acid group colors
# - N->C Gradient (C key): Gradient along the protein chain
#
# Note: Individual amino acid type colors (aa_types) are generated automatically
# from the theme's palette and do not need to be specified here.
#
# ========================================
# THEME STRUCTURE EXAMPLE
# ========================================

themes:
  # Default theme - reference structure
  Default:
    elements:
      C: "#404040"      # Carbon - dark gray
      O: "#F05050"      # Oxygen - red
      N: "#5078F0"      # Nitrogen - blue
      S: "#FFC832"      # Sulfur - yellow
      H: "#DCDCDC"      # Hydrogen - light gray
      P: "#FF8000"      # Phosphorus - orange
    aa_groups:
      Hydrophobic: "#FF9632"    # Orange
      Polar: "#50DC64"          # Green
      Positive: "#3278FF"       # Blue
      Negative: "#FF3C3C"       # Red
      Glycine: "#E6E6E6"        # Light gray
    gradient:
      start: "#3264FF"   # N-terminus - blue
      end: "#FF6464"     # C-terminus - red
    background: "#D3D3D3"  # Light gray background

  # ========================================
  # ADDITIONAL THEMES
  # ========================================

  # Spectral theme - Rainbow spectrum colormap
  # Based on ColorBrewer Spectral palette for scientific visualization
  "Retro Spectral":
    elements:
      C: "#F4A261"      # Orange
      O: "#E76F51"      # Red-orange
      N: "#264653"      # Navy
      S: "#2A9D8F"      # Green
      H: "#E9C46A"      # Yellow
      P: "#E9C46A"      # Yellow
    aa_groups:
      Hydrophobic: "#2A9D8F"    # Green
      Polar: "#E76F51"          # Red-orange
      Positive: "#F4A261"       # orange
      Negative: "#264653"       # navy
      Glycine: "#E9C46A"        # yellow
    gradient:
      start: "#F4A261"   # Deep magenta
      end: "#2A9D8F"     # Deep blue
    background: "#FAFAFA"  # Off-white background


# ========================================
# HOW TO ADD YOUR OWN THEME
# ========================================
#
# 1. Copy the Default theme structure above
# 2. Give it a unique name (e.g., "MyTheme:")
# 3. Customize the colors using hex codes (including background)
# 4. Save this file
# 5. The theme will be available after restarting the viewer
# 6. YAML themes appear FIRST when cycling with 'M' key
# 7. Press 'M' to cycle themes, 'N' for next mapping, 'Shift+N' for previous
#
# Color Guidelines:
# - Use contrasting colors for different elements
# - Ensure sufficient brightness for visibility
# - Test with both light and dark backgrounds
# - Consider colorblind-friendly palettes
#
# Example hex colors:
# Red tones: #FF0000, #DC143C, #B22222
# Blue tones: #0000FF, #4169E1, #1E90FF
# Green tones: #00FF00, #32CD32, #228B22
# Yellow tones: #FFFF00, #FFD700, #FFA500
# Purple tones: #800080, #9370DB, #BA55D3
